# Converted from LxiaopangClashRule.ini; add nodes using Sub-Store file Add Proxies operation.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.1.1.1/dns-query
proxies: []
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 香港
  - 🚀 手动切换1
  - ♻️ 自动选择
  - 机场
  - 🚀 手动切换2
  - 🚀 手动切换3
  - HY
  - GW
  - AZ
  - 日本
  - 新加坡
  - 美国
  - 台湾
  - DIRECT
- name: 🚀 手动切换1
  type: select
  proxies:
  - DIRECT
  include-all-proxies: true
- name: 🚀 手动切换2
  type: select
  proxies:
  - DIRECT
  include-all-proxies: true
- name: 🚀 手动切换3
  type: select
  proxies:
  - DIRECT
  include-all-proxies: true
- name: 📲 电报消息
  type: select
  proxies:
  - 香港
  - 🚀 手动切换1
  - 新加坡
  - 🚀 手动切换2
  - HY
  - GW
  - 🚀 节点选择
  - AZ
  - ♻️ 自动选择
  - 日本
  - 机场
  - 🚀 手动切换3
  - 美国
  - 台湾
  - DIRECT
- name: 🗺 91卫图
  type: select
  proxies:
  - 香港
  - ♻️ 自动选择
  - 🚀 手动切换2
  - 机场
  - AZ
  - 🚀 手动切换1
  - 🚀 手动切换3
  - HY
  - 🚀 节点选择
  - GW
  - 日本
  - 新加坡
  - 美国
  - 台湾
  - DIRECT
- name: 📹 油管视频
  type: select
  proxies:
